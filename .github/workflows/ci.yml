name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: setup-uv publishes moving major tags only through v7,
        # so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # Both files feed the resolution, so either changing should invalidate.
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          # Distinct per job: both jobs otherwise race for one cache key.
          cache-suffix: checks

      # uv.lock is committed but the install below does not consume it, so
      # nothing else would notice it drifting away from pyproject.toml. This
      # fails if the two disagree, keeping the lock usable for `uv sync`.
      - name: Check uv.lock is current
        run: uv lock --check

      # uv fetches the interpreter itself, so this does not depend on the runner
      # image happening to ship 3.14.
      - name: Install Python and project
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -e . --group dev

      # pygame and pygame-ce both provide the `pygame` module and must never both
      # be installed, so assert on the distributions rather than the import,
      # which cannot tell them apart.
      - name: Confirm pygame-ce is installed and upstream pygame is not
        run: |
          .venv/bin/python - <<'PY'
          import importlib.metadata as md
          import sys

          names = {d.metadata["Name"].lower() for d in md.distributions()}
          problems = []
          if "pygame-ce" not in names:
              problems.append("pygame-ce is not installed")
          if "pygame" in names:
              problems.append("upstream pygame is installed and conflicts with pygame-ce")
          if problems:
              for problem in problems:
                  print("ERROR:", problem)
              sys.exit(1)

          import pygame

          print("pygame module provided by pygame-ce", pygame.version.ver)
          PY

      - name: Ruff
        run: .venv/bin/ruff check .

      # `--check`, never a bare `ruff format`. The rewriting form cannot fail: it
      # would make edits that are discarded with the runner, so the step would
      # pass unconditionally and enforce nothing. The obvious command is the
      # useless one here.
      - name: Ruff format
        run: .venv/bin/ruff format --check .

      # Inherited upstream prose carried a dozen typos, including parameter
      # names that did not exist. Configuration, including the exclusion of the
      # verbatim CONSTITUTION.md mirror, lives in pyproject.toml.
      - name: Codespell
        run: .venv/bin/codespell

      # conftest.py selects the dummy SDL drivers, so no display or sound card is
      # needed. pygame-ce wheels bundle SDL, so there is nothing to apt-get.
      - name: Pytest
        run: .venv/bin/pytest

  package:
    name: Wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: package

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      # The guide image and the generator have each silently vanished from a
      # build before. Assert on the wheel's contents, not the working tree's.
      - name: Assert packaged data is present
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())

          required = {
              "memtest/assets/guide_en.png",
              "memtest/config/config.json",
              "memtest/config/example-config.json",
              "memtest/tools/generate_alerts.py",
          }
          missing = sorted(required - names)

          wavs = [
              name
              for name in names
              if name.startswith("memtest/assets/alerts/") and name.endswith(".wav")
          ]
          if len(wavs) != 21:
              missing.append(f"expected 21 alert wavs, found {len(wavs)}")

          if missing:
              print(f"{wheel} is missing:")
              for item in missing:
                  print("  -", item)
              sys.exit(1)
          print(f"{wheel}: all packaged data present ({len(wavs)} alert sounds)")
          PY

      # The step above proves the files are in the archive. This proves the
      # installed package imports, finds them at runtime, and still has its
      # console script.
      #
      # It runs from outside the repository on purpose. This project uses a flat
      # layout, so `import memtest` at the repository root resolves to the
      # working tree rather than to site-packages -- a check run there would pass
      # while the installed copy was broken. That is not hypothetical: it
      # produced a false verification during development. The site-packages
      # assertion below fails if this ever stops running from a neutral
      # directory.
      - name: Smoke-test the installed wheel
        run: |
          uv venv --python 3.14 /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          cd /tmp/wheelcheck
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy /tmp/wheelcheck/bin/python - <<'PY'
          import sys

          import memtest
          from memtest.game.main_game import config_profile
          from memtest.paths import ASSETS_DIR, CONFIG_DIR
          from memtest.tools.generate_alerts import worst_correlation

          problems = []

          if "site-packages" not in memtest.__file__:
              problems.append(
                  f"imported the working tree, not the install: {memtest.__file__}"
              )
          if not (ASSETS_DIR / "guide_en.png").is_file():
              problems.append("guide_en.png missing from the install")

          wavs = list((ASSETS_DIR / "alerts").rglob("*.wav"))
          if len(wavs) != 21:
              problems.append(f"expected 21 alert sounds, found {len(wavs)}")

          if config_profile(CONFIG_DIR / "config.json") != "smoke-test":
              problems.append("packaged config lost its smoke-test marker")

          if not 0 < worst_correlation("warm") < 0.03:
              problems.append("alert generator did not survive packaging")

          if problems:
              for problem in problems:
                  print("ERROR:", problem)
              sys.exit(1)
          print(f"installed package OK: {memtest.__file__}")
          PY
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy /tmp/wheelcheck/bin/memtest --help > /dev/null
          echo "console script OK"
